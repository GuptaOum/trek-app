<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Data flow of the trekking management application</title>
<desc id="d">Two panels. The first shows a request travelling from the browser through Flask routing, a session role check, SQLAlchemy and SQLite, then back through Jinja2 as rendered HTML. The second traces a booking request from form submission to slot validation, database commit and a redirect.</desc>

<rect x="0" y="0" width="900" height="720" fill="#ffffff"/>

<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
</marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#9a3b3b"/>
</marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#3d6b4a"/>
</marker>
</defs>

<text x="30" y="28" font-size="16" font-weight="bold" fill="#1a1a1a">A. Request lifecycle</text>
<text x="30" y="46" font-size="11.5" fill="#555">Every click is a full page load. No JSON, no AJAX, no API layer.</text>

<path d="M 105 88 L 105 68 L 555 68 L 555 84" fill="none" stroke="#37527a" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="330" y="64" text-anchor="middle" font-size="10" fill="#37527a">signed session cookie sent with every request</text>

<rect x="30" y="88" width="150" height="60" rx="4" fill="#e8eef7" stroke="#37527a" stroke-width="1.4"/>
<text x="105" y="113" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Browser</text>
<text x="105" y="131" text-anchor="middle" font-size="10.5" fill="#555">HTML form or link</text>

<rect x="255" y="88" width="150" height="60" rx="4" fill="#f0efe9" stroke="#6b6455" stroke-width="1.4"/>
<text x="330" y="113" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Flask route</text>
<text x="330" y="131" text-anchor="middle" font-size="10.5" fill="#555">@app.route match</text>

<rect x="480" y="88" width="150" height="60" rx="4" fill="#f0efe9" stroke="#6b6455" stroke-width="1.4"/>
<text x="555" y="113" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Role check</text>
<text x="555" y="131" text-anchor="middle" font-size="10.5" fill="#555">session['role']</text>

<rect x="705" y="88" width="150" height="60" rx="4" fill="#f0efe9" stroke="#6b6455" stroke-width="1.4"/>
<text x="780" y="113" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">SQLAlchemy</text>
<text x="780" y="131" text-anchor="middle" font-size="10.5" fill="#555">Trek.query.get()</text>

<line x1="180" y1="118" x2="248" y2="118" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="214" y="110" text-anchor="middle" font-size="10" fill="#555">HTTP</text>
<line x1="405" y1="118" x2="473" y2="118" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="630" y1="118" x2="698" y2="118" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>

<line x1="780" y1="148" x2="780" y2="189" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="790" y="174" font-size="10" fill="#555">SQL</text>

<path d="M 555 148 L 555 172 L 105 172 L 105 189" fill="none" stroke="#9a3b3b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr)"/>
<text x="336" y="168" text-anchor="middle" font-size="10" fill="#9a3b3b">wrong role, redirect to /login</text>

<rect x="705" y="196" width="150" height="60" rx="4" fill="#e6efe8" stroke="#3d6b4a" stroke-width="1.4"/>
<text x="780" y="221" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">SQLite</text>
<text x="780" y="239" text-anchor="middle" font-size="10.5" fill="#555">instance/trek.db</text>

<rect x="480" y="196" width="150" height="60" rx="4" fill="#f0efe9" stroke="#6b6455" stroke-width="1.4"/>
<text x="555" y="221" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Python objects</text>
<text x="555" y="239" text-anchor="middle" font-size="10.5" fill="#555">Trek, Booking, User</text>

<rect x="255" y="196" width="150" height="60" rx="4" fill="#f0efe9" stroke="#6b6455" stroke-width="1.4"/>
<text x="330" y="221" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Jinja2</text>
<text x="330" y="239" text-anchor="middle" font-size="10.5" fill="#555">render_template()</text>

<rect x="30" y="196" width="150" height="60" rx="4" fill="#e8eef7" stroke="#37527a" stroke-width="1.4"/>
<text x="105" y="221" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Finished HTML</text>
<text x="105" y="239" text-anchor="middle" font-size="10.5" fill="#555">painted by browser</text>

<line x1="705" y1="226" x2="637" y2="226" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="480" y1="226" x2="412" y2="226" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="255" y1="226" x2="187" y2="226" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="221" y="218" text-anchor="middle" font-size="10" fill="#555">HTML</text>

<line x1="30" y1="300" x2="870" y2="300" stroke="#ccc" stroke-width="1"/>

<text x="30" y="336" font-size="16" font-weight="bold" fill="#1a1a1a">B. Booking a trek, step by step</text>
<text x="30" y="356" font-size="11.5" fill="#555">POST /book/1 with members=2</text>

<rect x="30" y="378" width="160" height="56" rx="4" fill="#e8eef7" stroke="#37527a" stroke-width="1.4"/>
<text x="110" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Form submit</text>
<text x="110" y="419" text-anchor="middle" font-size="10.5" fill="#555">trek_details.html</text>

<rect x="255" y="378" width="160" height="56" rx="4" fill="#f0efe9" stroke="#6b6455" stroke-width="1.4"/>
<text x="335" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">book_trek()</text>
<text x="335" y="419" text-anchor="middle" font-size="10.5" fill="#555">request.form</text>

<rect x="480" y="378" width="160" height="56" rx="4" fill="#f0efe9" stroke="#6b6455" stroke-width="1.4"/>
<text x="560" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Checks</text>
<text x="560" y="419" text-anchor="middle" font-size="10.5" fill="#555">role, blocked, status</text>

<rect x="705" y="378" width="160" height="56" rx="4" fill="#f7efe4" stroke="#8a5a2b" stroke-width="1.4"/>
<text x="785" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Slots enough?</text>
<text x="785" y="419" text-anchor="middle" font-size="10.5" fill="#555">members vs available</text>

<line x1="190" y1="406" x2="248" y2="406" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="415" y1="406" x2="473" y2="406" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="640" y1="406" x2="698" y2="406" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>

<line x1="785" y1="434" x2="785" y2="493" stroke="#3d6b4a" stroke-width="1.6" marker-end="url(#arg)"/>
<text x="796" y="468" font-size="10.5" fill="#3d6b4a" font-weight="bold">yes</text>

<path d="M 785 434 L 882 434 L 882 598 L 800 598 L 800 613" fill="none" stroke="#9a3b3b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)"/>
<text x="864" y="520" text-anchor="middle" font-size="10.5" fill="#9a3b3b" font-weight="bold">no</text>

<rect x="705" y="500" width="160" height="70" rx="4" fill="#e6efe8" stroke="#3d6b4a" stroke-width="1.4"/>
<text x="785" y="523" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">One commit</text>
<text x="785" y="541" text-anchor="middle" font-size="10.5" fill="#555">add Booking and</text>
<text x="785" y="557" text-anchor="middle" font-size="10.5" fill="#555">reduce available_slots</text>

<rect x="440" y="500" width="160" height="70" rx="4" fill="#f0efe9" stroke="#6b6455" stroke-width="1.4"/>
<text x="520" y="523" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">redirect()</text>
<text x="520" y="541" text-anchor="middle" font-size="10.5" fill="#555">to /dashboard,</text>
<text x="520" y="557" text-anchor="middle" font-size="10.5" fill="#555">never render on POST</text>

<rect x="175" y="500" width="160" height="70" rx="4" fill="#e8eef7" stroke="#37527a" stroke-width="1.4"/>
<text x="255" y="523" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">GET /dashboard</text>
<text x="255" y="541" text-anchor="middle" font-size="10.5" fill="#555">booking history with</text>
<text x="255" y="557" text-anchor="middle" font-size="10.5" fill="#555">flash message</text>

<line x1="705" y1="535" x2="607" y2="535" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="440" y1="535" x2="342" y2="535" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="391" y="527" text-anchor="middle" font-size="10" fill="#555">302</text>

<rect x="440" y="620" width="425" height="56" rx="4" fill="#f7ecec" stroke="#9a3b3b" stroke-width="1.4"/>
<text x="652" y="643" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Rejected</text>
<text x="652" y="662" text-anchor="middle" font-size="10.5" fill="#555">flash 'Not enough slots available', back to /trek/1, nothing written</text>

<text x="30" y="602" font-size="11" fill="#555">Post, Redirect, Get:</text>
<text x="30" y="619" font-size="11" fill="#555">the POST answers with a</text>
<text x="30" y="636" font-size="11" fill="#555">redirect, so refreshing</text>
<text x="30" y="653" font-size="11" fill="#555">cannot book twice.</text>
</svg>
