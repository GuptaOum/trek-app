{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3>Assign Staff to {{ trek.name }}</h3>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Select Staff</label>
                <select name="staff_id" class="form-select">
                    <option value="">No staff</option>
                    {% for s in staff_list %}
                    <option value="{{ s.id }}" {% if trek.staff_id == s.id %}selected{% endif %}>{{ s.name }} ({{ s.username }})</option>
                    {% endfor %}
                </select>
            </div>
            <button class="btn btn-dark">Assign</button>
        </form>
    </div>
</div>
{% endblock %}
