{% extends 'base.html' %}
{% block title %}Assign Staff | Trek Manager{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('admin_dashboard') }}">Dashboard</a></li>
        <li class="breadcrumb-item active">Assign staff</li>
    </ol>
</nav>
<h3>Assign Staff to {{ trek.name }}</h3>
        <form method="post">
            <div class="mb-3">
                <label class="form-label" for="staff_id">Select Staff</label>
                <select id="staff_id" name="staff_id" class="form-select">
                    <option value="">No staff</option>
                    {% for s in staff_list %}
                    <option value="{{ s.id }}" {% if trek.staff_id == s.id %}selected{% endif %}>{{ s.name }} ({{ s.username }})</option>
                    {% endfor %}
                </select>
            </div>
            <button class="btn btn-dark">Assign</button>
        </form>
    </div>
</div>
{% endblock %}
