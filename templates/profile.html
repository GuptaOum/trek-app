{% extends 'base.html' %}
{% block title %}My Profile | Trek Manager{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3>My Profile</h3>
        <div class="text-center mb-4">
            {% if user.photo %}
            <img src="{{ url_for('static', filename='uploads/' + user.photo) }}" class="avatar-large">
            {% else %}
            <span class="avatar-large avatar-initials">{{ user.name[0]|upper }}</span>
            {% endif %}
            <div class="mt-2">
                <span class="badge bg-dark">{{ user.role|capitalize }}</span>
            </div>
        </div>
        <form method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label" for="photo">Profile Photo</label>
                <input id="photo" type="file" name="photo" class="form-control" accept="image/*">
                <small class="text-muted">png, jpg, jpeg or gif, up to 2 MB</small>
            </div>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" value="{{ user.username }}" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label" for="name">Full Name</label>
                <input id="name" type="text" name="name" class="form-control" value="{{ user.name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input id="email" type="email" name="email" class="form-control" value="{{ user.email }}">
            </div>
            <div class="mb-3">
                <label class="form-label" for="phone">Phone</label>
                <input id="phone" type="text" name="phone" class="form-control" value="{{ user.phone }}">
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">New Password</label>
                <input id="password" type="password" name="password" class="form-control" placeholder="leave blank to keep the old one">
            </div>
            <button class="btn btn-dark">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
