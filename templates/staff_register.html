{% extends 'base.html' %}
{% block title %}Join as Trek Staff | Trek Manager{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3>Trek Staff Registration</h3>
        <p class="text-muted">Your account will be active after admin approval.</p>
        <form method="post">
            <div class="mb-3">
                <label class="form-label" for="name">Full Name</label>
                <input id="name" type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input id="username" type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input id="password" type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input id="email" type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="phone">Phone</label>
                <input id="phone" type="text" name="phone" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label" for="experience">Experience</label>
                <textarea id="experience" name="experience" class="form-control" rows="3"></textarea>
            </div>
            <button class="btn btn-dark">Send Request</button>
        </form>
    </div>
</div>
{% endblock %}
