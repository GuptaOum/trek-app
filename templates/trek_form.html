{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <h3>{% if trek %}Edit Trek{% else %}Add Trek{% endif %}</h3>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Trek Name</label>
                <input type="text" name="name" class="form-control" value="{{ trek.name if trek else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control" value="{{ trek.location if trek else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Difficulty</label>
                <select name="difficulty" class="form-select">
                    <option value="Easy" {% if trek and trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                    <option value="Moderate" {% if trek and trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                    <option value="Difficult" {% if trek and trek.difficulty == 'Difficult' %}selected{% endif %}>Difficult</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Duration (days)</label>
                <input type="number" name="duration" class="form-control" value="{{ trek.duration if trek else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number" name="price" class="form-control" value="{{ trek.price if trek else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Start Date</label>
                <input type="date" name="start_date" class="form-control" value="{{ trek.start_date if trek else '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Total Slots</label>
                <input type="number" name="total_slots" class="form-control" value="{{ trek.total_slots if trek else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ trek.description if trek else '' }}</textarea>
            </div>
            <button class="btn btn-dark">Save</button>
        </form>
    </div>
</div>
{% endblock %}
